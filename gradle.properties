# AGP 9 brings a Kotlin plugin of its own, on a version of its choosing. Every module here — the
# Android launcher included — is compiled by the one Kotlin pinned in the version catalogue, so the
# built-in one is switched off and the ordinary Kotlin Android plugin is applied instead. That plugin
# does not yet understand AGP 9's new DSL, hence the second line.
android.builtInKotlin=false
android.newDsl=false

# The Android plugin loads a great deal of class metadata, and Gradle's default 384 MiB of metaspace
# is not enough to build this repository and an APK in one daemon.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
