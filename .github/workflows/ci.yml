name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and headless tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --stacktrace

  gl:
    name: OpenGL (Xvfb + llvmpipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # No GPU on a runner, so OpenGL comes from Mesa's software rasteriser. That is a feature:
      # if ComposeGL needs anything exotic from a driver, it fails here first.
      - name: Install a software OpenGL stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libglu1-mesa \
            libxi6 libxcursor1 libxrandr2 libxinerama1

      - name: Renderer tests with a real GL context
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ./gradlew :composegl-gdx:test --rerun-tasks --stacktrace

      - name: Prove the runtime redraws only when something changed
        env:
          SPIKE_S6_HEADLESS: '1'
        run: ./gradlew :spikes:s6-runtime-ui:run --stacktrace

      - name: Draw the spike with real OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          SPIKE_S6_SCRIPT: '1'
          SPIKE_S6_FRAMES: '300'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ./gradlew :spikes:s6-runtime-ui:run --stacktrace

      # A failed screenshot leaves the actual, the expected and a difference map side by side.
      # Without these, the first question a broken golden raises — what does it look like now? —
      # can only be answered by rerunning the job on a machine nobody has.
      - name: Keep what went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gl-test-output
          path: |
            **/build/reports/tests/**
            **/build/screenshots/**
