name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and headless tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --stacktrace

  gl:
    name: GL integration tests (Xvfb + llvmpipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # No GPU on a runner, so OpenGL comes from Mesa's software rasteriser. That is a feature:
      # if ComposeGL needs anything exotic from a driver, it fails here first.
      - name: Install a software OpenGL stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libglu1-mesa \
            libxi6 libxcursor1 libxrandr2 libxinerama1

      - name: Run the GL integration tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ./gradlew integrationTest --stacktrace

      - name: Smoke-test the demo
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          COMPOSEGL_DEMO_FRAMES: '120'
          COMPOSEGL_DEMO_SCREENSHOT: demo.png
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ./gradlew :composegl-demo-libgdx:run

      - name: Play the snake demo
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          COMPOSEGL_SNAKE_FRAMES: '1200'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ./gradlew :composegl-demo-snake:run

      - name: Run the showcase
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          COMPOSEGL_SHOWCASE_FRAMES: '200'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" ./gradlew :composegl-demo-showcase:run

      - name: Keep what went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gl-test-output
          path: |
            **/build/reports/tests/**
            **/src/integrationTest/resources/golden/*-actual.png
