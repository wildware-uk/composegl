name: CI

on:
  push:
    branches: [master]
  pull_request:

# A run on master is never cancelled once it has started: work lands straight on master, often
# minutes apart, and cancelling meant no run ever finished. A newer push still replaces a run that
# is only queued. Pull requests keep cancelling their older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build and headless tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # This also compiles composegl-ui for Linux native and runs its common test there. That is
      # what stops "the toolkit is platform-free" from being a claim nobody checks: a line reaching
      # for a JVM API fails here rather than on somebody's phone.
      - run: ./gradlew build --stacktrace

  browser:
    name: Browser (WebAssembly + WebGL in headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # The runner's Chrome, headless, with WebGL drawn by SwiftShader: no GPU needed. The toolkit's
      # common tests run in it too, which is what keeps "it compiles for the browser" honest.
      - name: The toolkit and the WebGL backend, in a real browser
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          ./gradlew :composegl-ui:wasmJsBrowserTest :composegl-webgl:wasmJsBrowserTest :composegl-demo-web:wasmJsBrowserTest :composegl-demo-web:wasmJsBrowserDistribution --stacktrace

      - name: Keep what went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-output
          path: |
            **/build/reports/tests/**
            **/build/screenshots/**

  gl:
    name: OpenGL (Xvfb + llvmpipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # No GPU on a runner, so OpenGL comes from Mesa's software rasteriser. That is a feature:
      # if ComposeGL needs anything exotic from a driver, it fails here first.
      - name: Install a software OpenGL stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri libglu1-mesa \
            libxi6 libxcursor1 libxrandr2 libxinerama1

      - name: Renderer tests with a real GL context
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ./gradlew :composegl-gdx:test --rerun-tasks --stacktrace

      # The same suite on a GL 3.2 core context, which is what a game on OpenGL ES 3 or desktop GL 3
      # gets. On GL 3 LibGDX takes other paths, and the interface once drew nothing there (#188).
      - name: Renderer tests on GL 3.2 core
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ./gradlew :composegl-gdx:testGl30 :composegl-lwjgl3:testGl30 --rerun-tasks --stacktrace

      # The second backend, which shares no code with the first. Its job is to disagree when the
      # toolkit has quietly assumed something about LibGDX.
      - name: The same scenes, drawn with no LibGDX anywhere
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ./gradlew :composegl-lwjgl3:test --rerun-tasks --stacktrace

      # The KorGE backend, in KorGE's own AWT window on Xvfb, the way a desktop game opens it.
      - name: The same scenes, drawn inside a KorGE game
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ./gradlew :composegl-korge:jvmTest --rerun-tasks --stacktrace

      # And again with no display at all: KorGE renders offscreen with llvmpipe. Both ways must agree.
      - name: KorGE with no display
        env:
          KORGE_HEADLESS: 'true'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: env -u DISPLAY ./gradlew :composegl-korge:jvmTest --rerun-tasks --stacktrace

      # The KorGE demo booted for real with no display, driven from its menu into settings and the game.
      - name: The KorGE demo, booted and played with no display
        env:
          KORGE_HEADLESS: 'true'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: env -u DISPLAY ./gradlew :composegl-demo-korge:check --rerun-tasks --stacktrace

      - name: Prove the runtime redraws only when something changed
        env:
          SPIKE_S6_HEADLESS: '1'
        run: ./gradlew :spikes:s6-runtime-ui:run --stacktrace

      - name: Draw the spike with real OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          SPIKE_S6_SCRIPT: '1'
          SPIKE_S6_FRAMES: '300'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ./gradlew :spikes:s6-runtime-ui:run --stacktrace

      # A failed screenshot leaves the actual, the expected and a difference map side by side.
      # Without these, the first question a broken golden raises — what does it look like now? —
      # can only be answered by rerunning the job on a machine nobody has.
      - name: Keep what went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gl-test-output
          path: |
            **/build/reports/tests/**
            **/build/screenshots/**
