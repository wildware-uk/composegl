# Publishes to Maven Central when a version tag is pushed.
#
# Releasing is `git tag v0.2.0 && git push --tags` and nothing else: the version comes from the tag
# itself, so there is no number to bump in a file and no commit that says "prepare 0.2.0".
#
# Running this workflow by hand from the Actions tab is a rehearsal instead. It builds, signs, and
# checks that Central accepts the credentials — and uploads nothing. Do that first after changing a
# secret. A Central release can never be deleted or replaced, so the cheap way to find out that a
# key is wrong is the run that cannot publish.
#
# It needs four secrets, and does nothing useful until they exist:
#
#   MAVEN_CENTRAL_USERNAME    the two halves of a user token from central.sonatype.com
#   MAVEN_CENTRAL_PASSWORD
#   SIGNING_KEY               a GPG secret key, ASCII-armoured (`gpg --armor --export-secret-keys`)
#   SIGNING_PASSWORD          its passphrase
#
# The namespace `uk.wildware` has to be verified in the Central portal first, by a DNS TXT record on
# wildware.uk. Until that is done this job will reach Central and be refused.
#
# `automaticRelease = false` in the root build is deliberate: this uploads and leaves the release
# sitting in the portal for a human to press the button on.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only. This job publishes to Central, not to the repository.
permissions:
  contents: read

# One at a time. Two releases uploading at once is not something Central makes easy to undo.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      # The whole history, because the version is read out of `git describe`. A shallow clone has
      # no tags, and the build would publish "0.1.0-SNAPSHOT" over whatever was asked for.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag like `v0.2.0-rc1` builds a snapshot, and Central refuses snapshots. Better to say so
      # in the first ten seconds than after a full build.
      - name: The tag is a release version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "releasing $TAG"
          else
            echo "::error::$TAG is not vX.Y.Z, so the build makes a snapshot and Central will refuse it"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # The same build the pull request passed, run again here. A tag is not a promise that
      # anything still compiles.
      - run: ./gradlew build --stacktrace

      # Does Central know this token? Asking whether a version exists is a read, so it changes
      # nothing and still fails on a bad or revoked token. The token is sent as one base64 blob,
      # which is what Central's API expects — it is not a password in a URL.
      - name: Central accepts the credentials
        env:
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "::error::MAVEN_CENTRAL_USERNAME or MAVEN_CENTRAL_PASSWORD is not set"; exit 1
          fi
          token=$(printf '%s:%s' "$USERNAME" "$PASSWORD" | base64 -w0)
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            'https://central.sonatype.com/api/v1/publisher/published?namespace=uk.wildware&name=composegl-ui&version=0.0.0-does-not-exist')
          case "$code" in
            200) echo "credentials accepted" ;;
            401|403) echo "::error::Central rejected the token ($code). Generate a new user token and reset both secrets."; exit 1 ;;
            *) echo "::warning::unexpected $code from Central; carrying on" ;;
          esac

      # The rehearsal: everything a real release does, into a local folder. If the GPG key or its
      # passphrase is wrong, it fails here, and nothing has left the runner.
      - name: Rehearse — build and sign, upload nothing
        if: github.event_name == 'workflow_dispatch'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew publishToMavenLocal --no-configuration-cache --stacktrace
          signed=$(find ~/.m2/repository/uk/wildware -name '*.asc' | wc -l)
          echo "$signed signatures written"
          [ "$signed" -gt 0 ] || { echo "::error::nothing was signed; check SIGNING_KEY"; exit 1; }

      - name: Publish
        if: github.event_name == 'push'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace | tee publish.log
          id=$(grep -o 'deployment id: [0-9a-f-]*' publish.log | tail -1 | cut -d' ' -f3)
          echo "DEPLOYMENT_ID=$id" >> "$GITHUB_ENV"
          echo "deployment $id"

      # The upload does not wait, so a green publish step means Central took the bundle, not that it
      # liked it. Validation happens afterwards and can still refuse an unverified namespace or a
      # missing signature. Without this, a failed release looks exactly like a good one.
      - name: Central validated the bundle
        if: github.event_name == 'push'
        env:
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          [ -n "$DEPLOYMENT_ID" ] || { echo "::warning::no deployment id in the publish output"; exit 0; }
          token=$(printf '%s:%s' "$USERNAME" "$PASSWORD" | base64 -w0)
          for _ in $(seq 1 40); do
            body=$(curl -sS -X POST -H "Authorization: Bearer $token" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID" || true)
            state=$(echo "$body" | jq -r '.deploymentState // "unknown"')
            echo "$state"
            case "$state" in
              VALIDATED|PUBLISHING|PUBLISHED) echo "$body" | jq .; exit 0 ;;
              FAILED) echo "$body" | jq .; echo "::error::Central refused the bundle; nothing was published"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::warning::still $state after ten minutes; look at the portal"

      - name: What to do next
        if: github.event_name == 'push'
        run: |
          echo "### Uploaded ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "It is sitting in the portal, not released. Open" >> "$GITHUB_STEP_SUMMARY"
          echo "<https://central.sonatype.com/publishing/deployments>, look at it, and press publish." >> "$GITHUB_STEP_SUMMARY"
          echo "That step is a person on purpose: a Central release can never be deleted or replaced." >> "$GITHUB_STEP_SUMMARY"
