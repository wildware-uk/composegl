# Publishes to Maven Central when a version tag is pushed.
#
# Releasing is `git tag v0.2.0 && git push --tags` and nothing else: the version comes from the tag
# itself, so there is no number to bump in a file and no commit that says "prepare 0.2.0".
#
# It needs four secrets, and does nothing until they exist:
#
#   MAVEN_CENTRAL_USERNAME    the two halves of a user token from central.sonatype.com
#   MAVEN_CENTRAL_PASSWORD
#   SIGNING_KEY               a GPG secret key, ASCII-armoured (`gpg --armor --export-secret-keys`)
#   SIGNING_PASSWORD          its passphrase
#
# The namespace `dev.wildware` has to be verified in the Central portal first, by a DNS TXT record on
# wildware.dev. Until that is done this job will reach Central and be refused.
#
# `automaticRelease = false` in the root build is deliberate: this uploads and leaves the release
# sitting in the portal for a human to press the button on. A Central release can never be deleted
# or replaced, so the last step is a person looking at it.

name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      # The whole history, because the version is read out of `git describe`. A shallow clone has
      # no tags, and the build would publish "0.1.0-SNAPSHOT" over whatever was asked for.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      # The same build the pull request passed, run again here. A tag is not a promise that
      # anything still compiles.
      - run: ./gradlew build --stacktrace

      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace
