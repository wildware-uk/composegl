# Every version here is an exact pin.
[versions]
kotlin = "2.4.20"
# The Compose *runtime* only. Compose UI is deliberately absent and must stay that way: see
# docs/superpowers/specs/2026-09-09-runtime-ui-design.md.
compose = "1.12.0"
coroutines = "1.9.0"
gdx = "1.14.2"
gdxControllers = "2.2.3"
lwjgl = "3.4.3"
jspecify = "1.0.0"
robovm = "2.3.26"
junit = "5.14.0"
# The Android Gradle plugin, only ever applied to the two Android modules.
agp = "9.2.1"
# AndroidX core, for window insets. The only AndroidX anything in the repository, and it is in
# composegl-android alone, where "what is the keyboard covering" has no other answer.
androidxCore = "1.13.1"

[libraries]
# --- the only two things composegl-ui is allowed to depend on ---
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

# --- backends ---
gdx = { module = "com.badlogicgames.gdx:gdx", version.ref = "gdx" }
gdx-freetype = { module = "com.badlogicgames.gdx:gdx-freetype", version.ref = "gdx" }
gdx-freetype-platform = { module = "com.badlogicgames.gdx:gdx-freetype-platform", version.ref = "gdx" }
gdx-backend-headless = { module = "com.badlogicgames.gdx:gdx-backend-headless", version.ref = "gdx" }
gdx-backend-lwjgl3 = { module = "com.badlogicgames.gdx:gdx-backend-lwjgl3", version.ref = "gdx" }
gdx-backend-android = { module = "com.badlogicgames.gdx:gdx-backend-android", version.ref = "gdx" }
gdx-platform = { module = "com.badlogicgames.gdx:gdx-platform", version.ref = "gdx" }
gdx-controllers = { module = "com.badlogicgames.gdx-controllers:gdx-controllers-core", version.ref = "gdxControllers" }
gdx-controllers-desktop = { module = "com.badlogicgames.gdx-controllers:gdx-controllers-desktop", version.ref = "gdxControllers" }
lwjgl = { module = "org.lwjgl:lwjgl", version.ref = "lwjgl" }
# LWJGL 3.4 puts @Nullable on its return types. Kotlin refuses to infer a type whose
# annotation it cannot see, so the annotations have to be on the compile classpath —
# they are not needed at runtime, which is what compileOnly says.
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
# The iOS bindings. Ordinary Java jars — UIKit as classes — so a module can be written and
# compiled against them anywhere. Only turning one into an app needs a Mac.
robovm-rt = { module = "com.mobidevelop.robovm:robovm-rt", version.ref = "robovm" }
robovm-cocoatouch = { module = "com.mobidevelop.robovm:robovm-cocoatouch", version.ref = "robovm" }
lwjgl-glfw = { module = "org.lwjgl:lwjgl-glfw", version.ref = "lwjgl" }
lwjgl-opengl = { module = "org.lwjgl:lwjgl-opengl", version.ref = "lwjgl" }
lwjgl-stb = { module = "org.lwjgl:lwjgl-stb", version.ref = "lwjgl" }

androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.14.0" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# Publishing to Maven Central. It knows how to publish a multiplatform module — every target, the
# sources jar, the javadoc jar, the signature on each — which is the part that is a day's work by
# hand and wrong the first three times.
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
